[package]
name = "veyla"
version = "2.6.1"
edition = "2021"
rust-version = "1.90"
description = "Veyla - GPUI shell"
publish = false

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
